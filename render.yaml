# Render "Blueprint": tells Render how to run Student Helper.
# On render.com choose  New -> Blueprint  and pick this GitHub repo.
# Render will ask you to fill in the values marked "sync: false".
services:
  - type: web
    name: student-helper
    runtime: node
    plan: free
    region: singapore              # closest free region to Bangladesh
    buildCommand: cd server && npm install && npm run db:setup
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # mysql://USER:PASSWORD@HOST:4000/student_helper  (from TiDB Cloud)
        sync: false
      - key: DB_SSL
        value: "true"
      - key: CHAT_SECRET_KEY       # 64 hex characters. Keep the same value forever!
        sync: false
      - key: JWT_SECRET
        generateValue: true        # Render makes a random secret for you
      - key: APP_TIMEZONE
        value: Asia/Dhaka
      - key: CHECKIN_WINDOW_MINUTES
        value: "15"
      - key: STREAK_MIN_POINTS
        value: "70"
