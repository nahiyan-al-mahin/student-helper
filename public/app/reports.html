<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · Student Helper</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#4f7a6a">
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Student Helper">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="reports" data-title="Reports">
<div id="app" hidden>
  <div class="card-head" style="flex-wrap:wrap">
    <div>
      <h1>My report</h1>
      <p class="muted" style="margin:0" id="rangeLabel"></p>
    </div>
    <div class="row no-print" style="flex:0 0 auto">
      <div class="tabs" id="range" style="margin:0">
        <button data-days="7" class="active">7 days</button><button data-days="30">30 days</button><button data-days="90">90 days</button>
      </div>
      <button class="btn ghost" id="printBtn"><i data-icon="printer"></i> Save PDF</button>
    </div>
  </div>
  <div id="report" style="margin-top:1rem"><p class="muted">Loading…</p></div>
</div>
<script src="/js/config.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>

<script src="/js/pages/reports.js"></script>
</body>
</html>
