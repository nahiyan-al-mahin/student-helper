<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · Student Helper</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="chat" data-title="Chat">
<div id="app" hidden>
  <div class="chat" id="chat">
    <div class="chat-list">
      <div class="head"><h3 style="margin:0">Messages</h3><small class="muted">Chat with people you follow or who follow you</small></div>
      <div id="convos"></div>
    </div>
    <div class="chat-main">
      <div class="chat-top" id="chatTop"></div>
      <div class="msgs" id="msgs"><div class="empty" style="margin:auto"><span class="big"><i data-icon="message"></i></span>Pick a conversation</div></div>
      <form class="chat-form hidden" id="chatForm">
        <input name="text" placeholder="Write a message…" autocomplete="off" maxlength="2000" required>
        <button class="btn">Send</button>
      </form>
      <div class="lock-note"><i data-icon="lock"></i> Messages are stored encrypted in the database.</div>
    </div>
  </div>
</div>
<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>

<script src="/js/pages/chat.js"></script>
</body>
</html>
