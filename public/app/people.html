<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People · Student Helper</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="people" data-title="People">
<div id="app" hidden>
  <h1>People</h1>
  <p class="muted">Follow friends and classmates, see how they are doing and get inspired.</p>
  <div class="tabs" id="tabs">
    <button class="active" data-tab="feed"><i data-icon="flame"></i> Following today</button>
    <button data-tab="find"><i data-icon="search"></i> Find people</button>
    <button data-tab="followers">Followers</button>
    <button data-tab="following">Following</button>
    <button data-tab="requests">Requests <span class="count hidden" id="reqCount"></span></button>
  </div>
  <div id="panel"></div>
</div>
<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>

<script src="/js/pages/people.js"></script>
</body>
</html>
